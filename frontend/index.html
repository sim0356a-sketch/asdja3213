
<!DOCTYPE html>
<html lang="ru" style="height: 100%; overflow: hidden;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>СказкаAI — Магия на каждой странице</title>
  
  <meta name="description" content="Создавайте персонализированные сказки с иллюстрациями, похожими на вашего ребенка.">
  <meta name="theme-color" content="#f3e8ff">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --glass-bg: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.6);
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f3e8ff 0%, #ffedd5 100%);
      background-attachment: fixed;
      color: #1e1b4b;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      height: 100%;
      width: 100%;
      -webkit-font-smoothing: antialiased;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Lexend', sans-serif;
      letter-spacing: -0.02em;
    }

    .magic-gradient {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(139, 92, 246, 0.1);
    }

    ::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>
  <div id="root" style="height: 100%;"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
